:root{--tx:#2f3742;--mut:#6b7480;--lin:#e3e6ea;--fd:#f6f7f9;--verde:#1b8a4a;--zap:#25d366;--esc:#2f3742;--amar:#fdd835}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Avenir Next",Avenir,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);background:#fff;-webkit-text-size-adjust:100%}
.bar{height:6px;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa)}
header{max-width:1120px;margin:0 auto;padding:18px 16px 8px;display:flex;align-items:center;gap:14px}
header img{width:56px;height:56px}
header h1{font-size:22px;line-height:1.1}
header p{font-size:13px;color:var(--mut);margin-top:2px}
.ferr{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--lin)}
.ferr div{max-width:1120px;margin:0 auto;padding:10px 16px}
#busca{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--lin);border-radius:12px;outline:none}
#busca:focus{border-color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--lin);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
.chip.on{background:var(--esc);border-color:var(--esc);color:#fff}
main{max-width:1120px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{border:1.5px solid var(--lin);border-radius:18px;padding:14px;display:flex;flex-direction:column}
.foto{height:210px;background:var(--fd);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.foto img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
.foto span{font-size:44px;opacity:.35}
.marca{font-size:12px;letter-spacing:2px;color:var(--mut);font-weight:700;margin-top:12px;text-transform:uppercase}
.nome{font-size:19px;font-weight:700;line-height:1.2;margin-top:2px}
.spec{font-size:14px;color:var(--mut);margin-top:4px}

.cores{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.preco{margin-top:auto;padding-top:14px}

.parc{font-size:14px;margin-top:2px}
.parc b{font-weight:700}
details{margin-top:8px;font-size:14px}
summary{cursor:pointer;color:var(--mut);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:" ▾"}
details[open] summary:after{content:" ▴"}
.tab{width:100%;border-collapse:collapse;margin-top:6px}
.tab td{padding:6px 0;border-bottom:1px solid var(--fd)}
.tab td:last-child{text-align:right;font-weight:700}
.comprar{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--zap);color:#fff;font:inherit;font-weight:800;font-size:16px;padding:13px;cursor:pointer}
.vazio{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
footer{max-width:1120px;margin:0 auto;padding:12px 16px 34px;text-align:center;font-size:13px;color:var(--mut);line-height:1.6}
footer b{color:var(--tx)}
.fundo{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}
.fundo.on{display:flex}
.folha{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px 26px}
.folha h2{font-size:19px}
.folha p{font-size:14px;color:var(--mut);margin:4px 0 12px}
.folha label{display:block;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--mut);margin:12px 0 6px}
.opc{display:flex;flex-wrap:wrap;gap:8px}
.opc button{border:1.5px solid var(--lin);background:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer;text-transform:capitalize}
.opc button.on{border-color:var(--esc);background:var(--esc);color:#fff}
.fechar{margin-top:10px;width:100%;border:0;background:none;font:inherit;color:var(--mut);padding:10px;cursor:pointer}
.tag.lac{background:#e7f5ec;color:#1b8a4a}.tag.vit{background:#fff4d6;color:#9a6b00}
.ofertas{max-width:1120px;margin:0 auto;padding:16px 0 4px}
.ofertas h2{font-size:18px;padding:0 16px 10px}
.trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.of{flex:none;width:250px;font-weight:400;font-size:14px;margin-top:0;text-align:left;scroll-snap-align:start;border-radius:18px;padding:14px;background:linear-gradient(160deg,#2f3742,#1d2229);color:#fff;cursor:pointer;position:relative}
.of .fo{height:130px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center}
.of .fo img{max-height:116px;max-width:90%;object-fit:contain}
.of .se{position:absolute;top:22px;left:22px;background:#e53935;color:#fff;font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px}
.of b{display:block;font-size:17px;margin-top:10px}
.of small{color:#c9ced6;font-size:13px}
.of s{display:block;color:#c9ced6;font-size:13px;margin-top:8px}
.of .pp{font-size:22px;font-weight:800;color:#fdd835}
.pontos{display:flex;justify-content:center;gap:6px;padding:4px 0 2px}
.pontos i{width:6px;height:6px;border-radius:50%;background:#d4d8dd}
.pontos i.on{background:#2f3742;width:16px;border-radius:3px}
.velho{font-size:13px;color:#8a929c;text-decoration:line-through}
.selo-of{display:inline-block;font-size:11px;font-weight:800;background:#e53935;color:#fff;border-radius:6px;padding:3px 7px;margin-right:4px}
</style>

const CORES = {preto:"#1d1f22",black:"#1d1f22",branco:"#f4f4f2",white:"#f4f4f2",prata:"#c9ccd1",silver:"#c9ccd1",cinza:"#8a8f96",grafite:"#4a4d52",azul:"#2f6fd6",verde:"#3f9a5a",roxo:"#7d4fc2",lilas:"#b9a2e0",rosa:"#f2a7c3",vermelho:"#d33",laranja:"#f28c28",amarelo:"#f5d33b",dourado:"#d8b56a",bege:"#e3d3b5",titanio:"#a59c90",natural:"#c2b8a8"};
const brl = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const semAc = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const corHex = c => { const k = semAc(c).split(" ")[0]; return CORES[k] || "#ccc"; };
let marca = D.marca_inicial || "Todas";
document.getElementById("atual").textContent = "Atualizado em " + D.atualizado;
document.getElementById("dia").textContent = D.dia;

const marcas = [...(D.marcas.length ? D.marcas : [...new Set(D.produtos.map(p => p.marca))]), "Todas"].filter(m => m==="Todas" || D.produtos.some(p => p.marca===m));
if (!marcas.includes(marca)) marca = "Todas";
const chips = document.getElementById("marcas");
marcas.forEach(m => { const b = document.createElement("button"); b.className = "chip" + (m===marca?" on":""); b.textContent = m;
  b.onclick = () => { marca = m; [...chips.children].forEach(x => x.classList.toggle("on", x===b)); desenhar(); }; chips.appendChild(b); });
document.getElementById("busca").oninput = desenhar;

function card(p, i){
  const t = p.tabela, d12 = t["12x"];
  const linhas = Object.entries(t).map(([f,v]) => `<tr><td>${f}</td><td>${v.vezes>1? v.vezes+"x de "+brl(v.parcela) : brl(v.total)}</td></tr>`).join("");
  const cores = p.cores.map(c => `<span class="cor"><i style="background:${corHex(c)}"></i>${c}</span>`).join("");
  return `<article class="card">
    <div class="foto">${p.foto? `<img src="${p.foto}" alt="${p.nome}" loading="lazy">` : "<span>📱</span>"}</div>
    <div class="marca">${p.marca}</div>
    <div class="nome">${p.nome}</div>
    <div class="spec">${[p.memoria, p.rede].filter(Boolean).join(" · ")}</div>
    <div>${p.condicao==="vitrine" ? `<span class="tag vit">Vitrine</span>` : `<span class="tag lac">Lacrado</span>`}<span class="tag">Versão ${p.versao}</span></div>
    <div class="cores">${cores}</div>
    <div class="preco">
      <div class="pix">${brl(p.pix)} <small>no PIX</small></div>
      <div class="parc">ou <b>12x de ${brl(d12.parcela)}</b> no cartão</div>
      <details><summary>Ver todas as formas</summary><table class="tab">${linhas}</table></details>
    </div>
    <button class="comprar" data-i="${i}">Quero este</button>
  </article>`;
}
function desenhar(){
  const q = semAc(document.getElementById("busca").value.trim());
  const lista = D.produtos.map((p,i)=>[p,i]).filter(([p]) => (marca==="Todas"||p.marca===marca) &&
    (!q || semAc(`${p.marca} ${p.nome} ${p.memoria} ${p.condicao}`).includes(q)));
  document.getElementById("lista").innerHTML = lista.length ? lista.map(([p,i]) => card(p,i)).join("")
    : `<div class="vazio">Nada encontrado. Chama a gente no WhatsApp que a gente procura pra você.</div>`;
}
desenhar();

// carrossel: aparelhos em destaque (escolhidos no painel)
const ofertas = D.produtos.map((p,i)=>[p,i]).filter(([p]) => p.destaque).slice(0, 12);
const trilho = document.getElementById("trilho"), pontos = document.getElementById("pontos");
if (!ofertas.length) document.getElementById("ofertasBox").style.display = "none";
trilho.innerHTML = ofertas.map(([p,i]) => `<div class="of comprar" data-i="${i}">
  <div class="fo">${p.foto ? `<img src="${p.foto}" alt="${p.nome}">` : "📱"}</div>
  <b>${p.nome}</b><small>${p.memoria}${p.condicao==="vitrine" ? " · vitrine" : ""}</small>
  <div class="pp" style="margin-top:8px">${brl(p.pix)}</div><small>no PIX ou 12x ${brl(p.tabela["12x"].parcela)}</small></div>`).join("");
pontos.innerHTML = ofertas.map((_,k) => `<i class="${k?"":"on"}"></i>`).join("");
let atualOf = 0, parado = false;
trilho.addEventListener("scroll", () => { const w = trilho.firstElementChild ? trilho.firstElementChild.offsetWidth + 12 : 1;
  atualOf = Math.round(trilho.scrollLeft / w); [...pontos.children].forEach((x,k) => x.classList.toggle("on", k===atualOf)); });
trilho.addEventListener("touchstart", () => parado = true, {passive:true});
setInterval(() => { if (parado || !ofertas.length) return; const w = trilho.firstElementChild.offsetWidth + 12;
  atualOf = (atualOf + 1) % ofertas.length; trilho.scrollTo({left: atualOf * w, behavior: "smooth"}); }, 3500);

// compra pelo WhatsApp: escolhe cor e loja, abre conversa com a mensagem pronta
let sel = {};
const fundo = document.getElementById("fundo");
function opcoes(id, itens, chave){
  const box = document.getElementById(id); box.innerHTML = "";
  itens.forEach((it, k) => { const b = document.createElement("button"); b.textContent = it.rot; if(k===0){ b.classList.add("on"); sel[chave]=it.v; }
    b.onclick = () => { [...box.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); sel[chave]=it.v; }; box.appendChild(b); });
}
const abrirCompra = e => {
  const b = e.target.closest(".comprar"); if(!b) return;
  const p = D.produtos[+b.dataset.i]; sel = {p};
  document.getElementById("fNome").textContent = `${p.nome} ${p.memoria}`;
  document.getElementById("fPreco").textContent = `${brl(p.pix)} no PIX ou 12x de ${brl(p.tabela["12x"].parcela)}`;
  document.getElementById("fCoresBox").style.display = p.cores.length > 1 ? "" : "none";
  opcoes("fCores", p.cores.map(c => ({rot:c, v:c})), "cor");
  if (p.cores.length <= 1) sel.cor = p.cores[0] || "";
  opcoes("fLojas", D.lojas.map(l => ({rot:l.nome, v:l})), "loja");
  fundo.classList.add("on");
};
document.getElementById("lista").onclick = abrirCompra;
trilho.onclick = abrirCompra;
document.getElementById("fFechar").onclick = () => fundo.classList.remove("on");
fundo.onclick = e => { if(e.target===fundo) fundo.classList.remove("on"); };
document.getElementById("fIr").onclick = () => {
  const p = sel.p;
  const msg = `Olá! Vi no site e tenho interesse no ${p.marca} ${p.nome} ${p.memoria}${p.condicao==="vitrine"?" (vitrine)":""}${sel.cor? " (" + sel.cor + ")" : ""} - ${brl(p.pix)} no PIX. Ainda tem?`;
  window.open(`https://wa.me/${sel.loja.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
  fundo.classList.remove("on");
};
</script>
